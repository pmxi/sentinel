name: sent

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sent
      POSTGRES_USER: sent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sent-local-only}
    volumes:
      - sent_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sent -d sent"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    restart: "no"
    command: ["node", "server/dist/migrate.js"]
    environment: &sent_environment
      DATABASE_URL: postgres://sent:${POSTGRES_PASSWORD:-sent-local-only}@postgres:5432/sent
      SENT_PUBLIC_URL: ${SENT_PUBLIC_URL}
      SENT_PASSWORD_HASH: ${SENT_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CLASSIFICATION_MODEL: ${OPENAI_CLASSIFICATION_MODEL:-gpt-5.6-luna}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build: .
    restart: unless-stopped
    environment: *sent_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "worker/dist/index.js"]
    environment: *sent_environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SENT_DOMAIN: ${SENT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  sent_postgres:
  caddy_data:
  caddy_config:
