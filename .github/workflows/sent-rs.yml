name: Sent Rust and Solid

on:
  # Production deploys require rust and web to pass on every master commit.
  push:
    branches: [master]
  pull_request:
    paths:
      - "sent-rs/**"
      - ".github/workflows/sent-rs.yml"

permissions:
  contents: read

concurrency:
  group: sent-rs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: sent_test_rust_ci
          POSTGRES_USER: sent
          POSTGRES_PASSWORD: sent-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sent -d sent_test_rust_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SENT_TEST_DATABASE_URL: postgres://sent:sent-ci@localhost:5432/sent_test_rust_ci
    defaults:
      run:
        working-directory: sent-rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sent-rs -> target
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash -n scripts/run-local.sh && python3 scripts/test-run-local.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sent-rs/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir sent-rs/web install --frozen-lockfile
      - run: pnpm --dir sent-rs/web typecheck
      - run: pnpm --dir sent-rs/web lint
      - run: pnpm --dir sent-rs/web test
      - run: pnpm --dir sent-rs/web build
