name: CI

on:
  # Production deploys require rust and web to pass on every master commit.
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: sent_test_rust_ci
          POSTGRES_USER: sent
          POSTGRES_PASSWORD: sent-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sent -d sent_test_rust_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SENT_TEST_DATABASE_URL: postgres://sent:sent-ci@localhost:5432/sent_test_rust_ci
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash -n scripts/run-local.sh && python3 scripts/test-run-local.py
      - run: bash -n deploy/deploy.sh deploy/sent-run && python3 deploy/test-deploy.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web build
