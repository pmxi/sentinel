[project]
name = "email-sentinel"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "google-auth-oauthlib==1.0.0",
    "google-auth-httplib2==0.1.0",
    "google-api-python-client==2.88.0",
    "pydantic>=2.0.0",
    "openai>=1.70.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "requests==2.31.0",
    "msgraph-sdk",
    "azure-identity",
    "flask>=3.0.0",
    "authlib>=1.3.0",
    "segno>=1.6.0",
]

[project.scripts]
sentinel-web = "sentinel.web.app:main"
sentinel-worker = "sentinel.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/sentinel",
]

[dependency-groups]
dev = [
    "ty>=0.0.40",
    # Runs the web + worker processes together from the Procfile (`honcho start`)
    # so a single dev command brings up the same two-process topology as prod.
    "honcho>=2.0.0",
]
# Production-only: the WSGI server that fronts the Flask app under systemd.
# Installed on the server with `uv sync --no-dev --group prod`.
prod = [
    "gunicorn>=23.0.0",
]
