{% extends "base.html" %}
{% block title %}Live — Sentinel{% endblock %}
{% block content %}
<style>
  .live-wrap { display: grid; grid-template-columns: 280px 1fr; gap: 1em; align-items: start; }
  .live-side { position: sticky; top: 1em; }
  .live-side h3 { margin: 0.4em 0 0.2em; font-size: 0.85em; opacity: 0.7; letter-spacing: 0.05em; text-transform: uppercase; }
  .live-side .src-row { display: flex; justify-content: space-between; gap: 0.5em; padding: 0.35em 0.5em; border-radius: 4px; cursor: pointer; user-select: none; }
  .live-side .src-row:hover { background: rgba(0,0,0,0.04); }
  .live-side .src-row.active { background: rgba(50, 100, 200, 0.12); font-weight: 600; }
  .live-side .src-row .rate { opacity: 0.55; font-variant-numeric: tabular-nums; font-size: 0.9em; }
  .live-stats { display: flex; gap: 1.5em; margin: 0 0 0.8em; font-variant-numeric: tabular-nums; }
  .live-stats .stat { display: flex; flex-direction: column; }
  .live-stats .stat-val { font-size: 1.4em; font-weight: 700; }
  .live-stats .stat-lbl { font-size: 0.8em; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; }
  .live-feed { max-height: 80vh; overflow-y: auto; border: 1px solid rgba(0,0,0,0.08); border-radius: 6px; background: rgba(0,0,0,0.01); }
  .feed-item { padding: 0.6em 0.9em; border-bottom: 1px solid rgba(0,0,0,0.05); display: grid; grid-template-columns: 1fr auto; gap: 0.4em 1em; }
  .feed-item:last-child { border-bottom: none; }
  .feed-item.important { background: linear-gradient(90deg, rgba(204,51,51,0.08), transparent); border-left: 3px solid #c33; padding-left: calc(0.9em - 3px); }
  .feed-item .ftitle { font-weight: 500; line-height: 1.3; }
  .feed-item .ftitle a { color: inherit; text-decoration: none; }
  .feed-item .ftitle a:hover { text-decoration: underline; }
  .feed-item .fmeta { font-size: 0.82em; opacity: 0.55; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
  .feed-item .fbody { grid-column: 1 / -1; font-size: 0.88em; opacity: 0.7; line-height: 1.4; }
  .feed-item .ftag { display: inline-block; padding: 0 0.4em; border-radius: 3px; background: rgba(0,0,0,0.06); font-size: 0.75em; font-variant-numeric: tabular-nums; margin-right: 0.3em; }
  .feed-item .ftag.important { background: rgba(204,51,51,0.18); color: #c33; font-weight: 600; }
  .feed-controls { display: flex; gap: 0.6em; align-items: center; margin-bottom: 0.8em; }
  .feed-controls input[type=text] { flex: 1; padding: 0.4em 0.6em; }
  .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2a2; }
  .pulse.warn { background: #c80; }
  .pulse.err { background: #c33; }
  @media (max-width: 800px) {
    .live-wrap { grid-template-columns: 1fr; }
    .live-side { position: static; }
  }
</style>

<section>
  <h2 style="display: flex; align-items: center; gap: 0.6em;">
    Live monitor
    <span id="conn-pulse" class="pulse warn" title="connecting…"></span>
    <span id="conn-text" style="font-size: 0.7em; opacity: 0.6; font-weight: normal;">connecting…</span>
    <span style="flex:1"></span>
    <button id="pause-btn" type="button" style="font-size: 0.75em;">Pause</button>
  </h2>

  <div class="live-stats">
    <div class="stat"><span class="stat-val" id="rate-1s">0</span><span class="stat-lbl">items / sec (5s avg)</span></div>
    <div class="stat"><span class="stat-val" id="rate-60s">0</span><span class="stat-lbl">items / min</span></div>
    <div class="stat"><span class="stat-val" id="total-seen">0</span><span class="stat-lbl">total seen (session)</span></div>
    <div class="stat"><span class="stat-val" id="total-imp">0</span><span class="stat-lbl">important</span></div>
  </div>

  <div class="live-wrap">
    <aside class="live-side">
      <h3>Source type</h3>
      <div id="filter-types"></div>
      <h3 style="margin-top: 1.2em;">Top streams</h3>
      <div id="filter-streams"></div>
    </aside>

    <div>
      <div class="feed-controls">
        <input id="filter-q" type="text" placeholder="filter by title / author / stream…">
        <label><input id="show-bodies" type="checkbox"> show bodies</label>
        <span id="filter-summary" style="opacity:0.6;font-size:0.85em"></span>
      </div>
      <div id="feed" class="live-feed">
        <div style="padding: 1em; opacity: 0.5; text-align: center;" id="feed-empty">Waiting for events…</div>
      </div>
    </div>
  </div>
</section>

<script>
(function () {
  const MAX_FEED_ITEMS = 300;
  const STREAM_LEADERBOARD_N = 12;
  const RATE_WIN_5S_MS = 5000;
  const RATE_WIN_60S_MS = 60000;

  const feedEl = document.getElementById("feed");
  const feedEmptyEl = document.getElementById("feed-empty");
  const filterTypesEl = document.getElementById("filter-types");
  const filterStreamsEl = document.getElementById("filter-streams");
  const filterQEl = document.getElementById("filter-q");
  const showBodiesEl = document.getElementById("show-bodies");
  const filterSummaryEl = document.getElementById("filter-summary");
  const connPulse = document.getElementById("conn-pulse");
  const connText = document.getElementById("conn-text");
  const pauseBtn = document.getElementById("pause-btn");

  // Source-type counters
  const typeStats = new Map();   // type -> {total, ts: [] }
  const streamStats = new Map(); // stream_name -> {total, lastTs}
  // Each entry in `events` is { ts, srcType, streamName, item }.
  // Pruned to MAX_FEED_ITEMS (after filtering).
  const events = [];
  // Recent timestamps for global rate calc (also pruned).
  const rateBuf = [];

  let total_seen = 0;
  let total_imp = 0;
  let activeType = null;   // null = all
  let activeStream = null; // null = all
  let q = "";
  let paused = false;
  let needsRender = false;
  let needsLeaderRender = true;

  function recordItem(item, srcType, streamName, isImportant) {
    const now = performance.now();
    total_seen += 1;
    if (isImportant) total_imp += 1;
    rateBuf.push(now);

    // Type stats
    let ts = typeStats.get(srcType);
    if (!ts) { ts = {total: 0, recent: []}; typeStats.set(srcType, ts); }
    ts.total += 1; ts.recent.push(now);

    // Stream stats
    let ss = streamStats.get(streamName);
    if (!ss) { ss = {total: 0, lastTs: 0, srcType}; streamStats.set(streamName, ss); }
    ss.total += 1; ss.lastTs = now;

    events.unshift({ts: now, srcType, streamName, item, important: isImportant});
    while (events.length > MAX_FEED_ITEMS * 4) events.pop();
  }

  function passesFilter(e) {
    if (activeType && e.srcType !== activeType) return false;
    if (activeStream && e.streamName !== activeStream) return false;
    if (q) {
      const needle = q.toLowerCase();
      const hay = ((e.item.title || "") + " " + (e.item.author || "") + " " + e.streamName).toLowerCase();
      if (!hay.includes(needle)) return false;
    }
    return true;
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderFeed() {
    needsRender = false;
    const shown = events.filter(passesFilter).slice(0, MAX_FEED_ITEMS);
    if (shown.length === 0) {
      feedEl.innerHTML = '<div style="padding: 1em; opacity: 0.5; text-align: center;">No matching items yet.</div>';
      filterSummaryEl.textContent = "";
      return;
    }
    filterSummaryEl.textContent = `${shown.length} shown · ${events.length} buffered`;
    const showBodies = showBodiesEl.checked;
    const html = shown.map(e => {
      const it = e.item;
      const cls = e.important ? "feed-item important" : "feed-item";
      const importantTag = e.important ? '<span class="ftag important">IMPORTANT</span>' : "";
      const summary = e.important && it.summary ? `<div class="fbody">${escapeHtml(it.summary)}</div>` : "";
      const body = (showBodies && it.body) ? `<div class="fbody">${escapeHtml(it.body).slice(0, 500)}</div>` : "";
      const titleEl = it.url
        ? `<a href="${escapeHtml(it.url)}" target="_blank" rel="noopener">${escapeHtml(it.title || "(no title)")}</a>`
        : escapeHtml(it.title || "(no title)");
      return `<div class="${cls}">
        <div class="ftitle">${importantTag}${titleEl}</div>
        <div class="fmeta">${escapeHtml(e.srcType)} · ${escapeHtml(e.streamName || "?")}</div>
        ${summary || body}
      </div>`;
    }).join("");
    feedEl.innerHTML = html;
  }

  function pruneTs(buf, now, win) {
    const cutoff = now - win;
    while (buf.length && buf[0] < cutoff) buf.shift();
  }

  function updateStats() {
    const now = performance.now();
    pruneTs(rateBuf, now, RATE_WIN_60S_MS);
    document.getElementById("total-seen").textContent = total_seen.toLocaleString();
    document.getElementById("total-imp").textContent = total_imp.toLocaleString();
    const recent5 = rateBuf.filter(t => t > now - RATE_WIN_5S_MS).length;
    document.getElementById("rate-1s").textContent = (recent5 / 5).toFixed(1);
    document.getElementById("rate-60s").textContent = rateBuf.length.toLocaleString();
  }

  function renderTypes() {
    const now = performance.now();
    const rows = [...typeStats.entries()].map(([k, v]) => {
      pruneTs(v.recent, now, RATE_WIN_60S_MS);
      return { name: k, total: v.total, recent: v.recent.length };
    }).sort((a, b) => b.total - a.total);

    const allTotal = total_seen.toLocaleString();
    let html = `<div class="src-row ${activeType ? '' : 'active'}" data-type="">
      <span>All</span><span class="rate">${allTotal}</span>
    </div>`;
    for (const r of rows) {
      const active = activeType === r.name ? "active" : "";
      html += `<div class="src-row ${active}" data-type="${escapeHtml(r.name)}">
        <span>${escapeHtml(r.name)}</span>
        <span class="rate">${(r.recent).toLocaleString()}/min</span>
      </div>`;
    }
    filterTypesEl.innerHTML = html;
    filterTypesEl.querySelectorAll(".src-row").forEach(el => {
      el.addEventListener("click", () => {
        const t = el.dataset.type;
        activeType = t || null;
        activeStream = null;
        needsRender = true;
        needsLeaderRender = true;
      });
    });
  }

  function renderStreams() {
    needsLeaderRender = false;
    // Filter streams by active type if set
    const all = [...streamStats.entries()];
    const filtered = activeType ? all.filter(([_, v]) => v.srcType === activeType) : all;
    filtered.sort((a, b) => b[1].total - a[1].total);
    const top = filtered.slice(0, STREAM_LEADERBOARD_N);

    if (top.length === 0) {
      filterStreamsEl.innerHTML = '<div style="opacity:0.5;font-size:0.85em;padding:0.3em 0.5em;">(none yet)</div>';
      return;
    }
    let html = `<div class="src-row ${activeStream ? '' : 'active'}" data-stream="">
      <span>${activeType ? `all in ${escapeHtml(activeType)}` : 'all streams'}</span>
      <span class="rate"></span>
    </div>`;
    for (const [name, v] of top) {
      const active = activeStream === name ? "active" : "";
      const label = name.length > 28 ? name.slice(0, 26) + "…" : name;
      html += `<div class="src-row ${active}" data-stream="${escapeHtml(name)}" title="${escapeHtml(name)}">
        <span>${escapeHtml(label)}</span>
        <span class="rate">${v.total}</span>
      </div>`;
    }
    filterStreamsEl.innerHTML = html;
    filterStreamsEl.querySelectorAll(".src-row").forEach(el => {
      el.addEventListener("click", () => {
        activeStream = el.dataset.stream || null;
        needsRender = true;
      });
    });
  }

  // Render loops — coalesce updates to avoid per-event DOM churn
  setInterval(() => { if (!paused) { updateStats(); renderTypes(); } }, 1000);
  setInterval(() => { if (!paused && needsLeaderRender) renderStreams(); }, 2000);
  setInterval(() => { if (!paused && needsRender) renderFeed(); }, 200);

  filterQEl.addEventListener("input", () => { q = filterQEl.value.trim(); needsRender = true; });
  showBodiesEl.addEventListener("change", () => { needsRender = true; });
  pauseBtn.addEventListener("click", () => {
    paused = !paused;
    pauseBtn.textContent = paused ? "Resume" : "Pause";
  });

  // Classified items arriving in real-time merge into the matching item if
  // we still have it in the buffer, otherwise we just count them. The SSE
  // stream sends both item_received and item_classified for each item.
  function handleItemReceived(item) {
    const srcType = "email";
    const streamName = item.stream_name || "(unknown)";
    recordItem(item, srcType, streamName, false);
    needsRender = true;
    needsLeaderRender = true;
  }

  function handleItemClassified(payload) {
    // payload looks like an Item flattened plus priority/summary/reasoning.
    const itemId = payload.item_id;
    const isImp = payload.priority === "important";
    // Try to merge into the existing event (so the feed entry upgrades to
    // important with summary), otherwise push as a fresh entry.
    let merged = false;
    for (let i = 0; i < Math.min(events.length, 500); i++) {
      const e = events[i];
      if (e.item && e.item.item_id === itemId) {
        e.important = isImp;
        e.item.priority = payload.priority;
        e.item.summary = payload.summary;
        e.item.reasoning = payload.reasoning;
        if (isImp) total_imp += 1;
        merged = true; break;
      }
    }
    if (!merged) {
      const srcType = "email";
      const streamName = payload.stream_name || "(unknown)";
      recordItem(payload, srcType, streamName, isImp);
    }
    needsRender = true;
  }

  const es = new EventSource("{{ url_for('events_stream') }}");
  es.addEventListener("open", () => {
    connPulse.className = "pulse"; connText.textContent = "live";
  });
  es.addEventListener("error", () => {
    connPulse.className = "pulse err"; connText.textContent = "reconnecting…";
  });
  es.addEventListener("item_received", (ev) => {
    if (paused) return;
    try { handleItemReceived(JSON.parse(ev.data)); } catch (e) { console.error(e); }
  });
  es.addEventListener("item_classified", (ev) => {
    if (paused) return;
    try { handleItemClassified(JSON.parse(ev.data)); } catch (e) { console.error(e); }
  });

  // Initial render
  renderTypes();
  renderStreams();
})();
</script>
{% endblock %}
